---
apiVersion: v1
kind: Pod
metadata:
  name: networkpolicy-server-pod
  namespace: openshift-cluster-version
  labels:
    app: networkpolicy-server
spec:
  restartPolicy: Never
  containers:
  - name: http-server
    image: python:3.12-alpine
    command: ["python3", "-m", "http.server", "8080"]
---
apiVersion: v1
kind: Service
metadata:
  name: networkpolicy-server-service
  namespace: openshift-cluster-version
spec:
  selector:
    app: networkpolicy-server
  ports:
  - port: 8080