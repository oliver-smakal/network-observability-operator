apiVersion: v1
kind: Pod
metadata:
  name: networkpolicy-client-pod
  namespace: openshift-cluster-version
spec:
  restartPolicy: Never
  containers:
  - name: curl-client
    image: quay.io/curl/curl:latest
    command: ["sh", "-c", "sleep 5 && curl -s --connect-timeout 10 http://networkpolicy-server-service:8080"]