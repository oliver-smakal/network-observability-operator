apiVersion: v1
kind: Service
metadata:
  name: linux-webserver{{- if .NameSuffix }}-{{ .NameSuffix }}{{- end }}
  labels:
    app: linux-webserver{{- if .NameSuffix }}-{{ .NameSuffix }}{{- end }}
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: linux-webserver{{- if .NameSuffix }}-{{ .NameSuffix }}{{- end }}
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: linux-webserver{{- if .NameSuffix }}-{{ .NameSuffix }}{{- end }}
  name: linux-webserver{{- if .NameSuffix }}-{{ .NameSuffix }}{{- end }}
spec:
  selector:
    matchLabels:
      app: linux-webserver{{- if .NameSuffix }}-{{ .NameSuffix }}{{- end }}
  replicas: {{ .Replicas }}
  template:
    metadata:
      labels:
        app: linux-webserver{{- if .NameSuffix }}-{{ .NameSuffix }}{{- end }}
      name: linux-webserver{{- if .NameSuffix }}-{{ .NameSuffix }}{{- end }}
    spec:
      containers:
      - name: linux-webserver
        image: {{ .ImageName }}
        ports:
        - containerPort: 8080
